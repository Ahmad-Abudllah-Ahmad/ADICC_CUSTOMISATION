# Render Infrastructure-as-Code blueprint
# https://docs.render.com/infrastructure-as-code
#
# Deploys the OpenTakeoff web app as a Render Static Site.
# The app is a client-only Vite + React SPA — no server runtime needed.
#
# Environment variables (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) must be
# configured in the Render Dashboard under the service's Environment tab.
# They are inlined by Vite at build time and are public/anon keys by design.

services:
  - type: web
    runtime: static
    name: adicc
    # The web app lives in the web/ subdirectory of the monorepo.
    rootDir: web
    # Build: tolerant voice-model fetch (optional, degrades gracefully) + Vite build.
    # Mirrors the existing Netlify build command from netlify.toml.
    buildCommand: node scripts/fetch-voice-model.mjs || echo 'voice model fetch failed — deploying without voice'; npm run build
    staticPublishPath: dist
    # Pin to Node 24 to match the project's engines requirement and .nvmrc.
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Supabase public credentials — set actual values in the Render Dashboard.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA catch-all: serve index.html for all routes so react-router works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers — ported verbatim from web/public/_headers (the single
    # source of truth for the CSP and companion headers).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src * data: blob:; worker-src 'self' blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
